# AICU 呼吸道菌群预后研究 — 分析配置
project:
  name: "AICU呼吸道菌群预后研究"
  output_dir: "output"

paths:
  clinical_data: "../ALL/临床样本收集表3.xlsx"
  microbiome_asv: "data/microbiome/asv_table.csv"
  taxonomy: "data/microbiome/taxonomy.csv"

outcomes:
  extubation_time_col: "extubation_time_min"
  icu_stay_col: "icu_stay_min"
  adverse_event_col: "adverse_event"
  qor15_col: "qor15"

grouping:
  extubation_split: "median"  # median | fixed
  extubation_fixed_min: 68.5
  crp_threshold: 10.0  # mg/L

analysis:
  random_seed: 42
  permutations: 999
  bootstrap_n: 1000
  lda_threshold: 2.0
  fdr_alpha: 0.05
  use_demo_microbiome: true  # 无真实 ASV 数据时自动生成演示数据

# 纳入排除（演示环境放宽，正式分析见 config.server.yaml）
inclusion:
  enabled: true
  require_extubation_time: true
  require_core_clinical: false   # 演示数据部分字段缺失
  exclude_history: false
  max_clinical_missing_frac: 0.50

# 菌群 QC（演示环境关闭；服务器正式跑时开启）
qc:
  enabled: false
  min_total_reads: 1000
  min_observed_asv: 20
  max_observed_asv: 500
  max_shannon: 6.0
  asv_min_prevalence: 0.10
  remove_unassigned_taxonomy: true

visualization:
  dpi: 300
  fig_format: "png"
  style: "seaborn-v0_8-whitegrid"
