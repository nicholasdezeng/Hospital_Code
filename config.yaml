# AICU 呼吸道菌群预后研究 — 分析配置
project:
  name: "AICU呼吸道菌群预后研究"
  output_dir: "output"

paths:
  clinical_data: "../ALL/临床样本收集表3.xlsx"
  microbiome_asv: "data/microbiome/asv_table.csv"
  taxonomy: "data/microbiome/taxonomy.csv"

outcomes:
  extubation_time_col: "extubation_time_min"
  icu_stay_col: "icu_stay_min"
  adverse_event_col: "adverse_event"
  qor15_col: "qor15"

grouping:
  extubation_split: "median"  # median | fixed
  extubation_fixed_min: 68.5
  crp_threshold: 10.0  # mg/L

analysis:
  random_seed: 42
  permutations: 999
  bootstrap_n: 1000
  permutation_n: 500
  lda_threshold: 2.0
  fdr_alpha: 0.05
  use_demo_microbiome: true

inclusion:
  enabled: true
  require_extubation_time: true
  require_core_clinical: false
  exclude_history: false
  max_clinical_missing_frac: 0.50

qc:
  enabled: false
  min_raw_reads: 3000
  min_assigned_reads: 200
  min_observed_asv: 10
  max_observed_asv: 800
  max_shannon: 6.5
  asv_min_prevalence: 0.05
  remove_unassigned_taxonomy: false

sensitivity:
  enabled: true
  relaxed_qc:
    min_raw_reads: 1000
    min_assigned_reads: 50
    min_observed_asv: 5
    max_observed_asv: 1200
    max_shannon: 7.0
    asv_min_prevalence: 0.03
    remove_unassigned_taxonomy: false

visualization:
  dpi: 300
  fig_format: "png"
  style: "seaborn-v0_8-whitegrid"
