# DADA2 v2 — 输出到 microbiome_v2，不覆盖原 asv_table.csv
# 用法:
#   Rscript scripts/dada2/run_dada2.R --config config.server.dada2_v2.yaml
#   Rscript scripts/dada2/assign_taxonomy.R --config config.server.dada2_v2.yaml
#   python scripts/compare_asv_tables.py --config config.server.dada2_v2.yaml
# 若 v2 更好，再把 config.server.yaml 的 microbiome 路径改指向 v2

project:
  name: "AICU呼吸道菌群预后研究"
  output_dir: "output_v2_dada2"

paths:
  clinical_data: "/media/cxhlab/backup/Hospital_Data_Analysis/data/临床样本收集表3.xlsx"
  raw_fastq_dir: "/media/cxhlab/backup/Hospital_Data_Analysis/data/data"
  sample_manifest: "/media/cxhlab/backup/Hospital_Data_Analysis/data/data/data_number_sorted.xlsx"
  sample_manifest_output: "/media/cxhlab/backup/Hospital_Data_Analysis/data/microbiome/sample_manifest.csv"
  microbiome_asv: "/media/cxhlab/backup/Hospital_Data_Analysis/data/microbiome_v2/asv_table.csv"
  taxonomy: "/media/cxhlab/backup/Hospital_Data_Analysis/data/microbiome_v2/taxonomy.csv"
  silva_ref: "/media/cxhlab/backup/databases/silva/silva_nr99_v138.2_toGenus_trainset.fa.gz"
  silva_species: "/media/cxhlab/backup/databases/silva/silva_v138.2_assignSpecies.fa.gz"

# 相对 v1：加长 truncLen 提高双端 overlap；merge 略放宽
dada2:
  truncLen: [280, 260]
  maxEE: [2, 2]
  minOverlap: 8
  maxMismatch: 2
  minBoot: 50

outcomes:
  extubation_time_col: "extubation_time_min"
  icu_stay_col: "icu_stay_min"
  adverse_event_col: "adverse_event"
  qor15_col: "qor15"

grouping:
  extubation_split: "median"
  extubation_fixed_min: 68.5
  crp_threshold: 10.0

analysis:
  random_seed: 42
  permutations: 999
  bootstrap_n: 1000
  permutation_n: 500
  lda_threshold: 2.0
  fdr_alpha: 0.05
  use_demo_microbiome: false

inclusion:
  enabled: true
  require_extubation_time: true
  require_core_clinical: true
  exclude_history: true
  max_clinical_missing_frac: 0.20

qc:
  enabled: true
  min_raw_reads: 1500
  min_assigned_reads: 100
  min_observed_asv: 8
  max_observed_asv: 1100
  max_shannon: 7.0
  asv_min_prevalence: 0.03
  remove_unassigned_taxonomy: false

sensitivity:
  enabled: true
  strict_qc:
    min_raw_reads: 3000
    min_assigned_reads: 200
    min_observed_asv: 10
    max_observed_asv: 800
    max_shannon: 6.5
    asv_min_prevalence: 0.05
    remove_unassigned_taxonomy: false
  relaxed_qc:
    min_raw_reads: 1000
    min_assigned_reads: 50
    min_observed_asv: 5
    max_observed_asv: 1200
    max_shannon: 7.0
    asv_min_prevalence: 0.03
    remove_unassigned_taxonomy: false

visualization:
  dpi: 300
  fig_format: "png"
  style: "seaborn-v0_8-whitegrid"
